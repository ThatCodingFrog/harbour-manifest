name: Check for Port Updates

on:
  schedule:
    - cron: '25 */6 * * *' # Every 6 hours at minute 25
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    # REQUIRED: Explicit permissions for the token
    permissions:
      contents: write
      pull-requests: write

    # OPT-IN: Force Node 24 runtime to fix deprecation
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Updated to v6 for Node 24 support
      - uses: actions/checkout@v6

      - name: Run Update Script
        run: node update.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Updated to v8 for Node 24 support
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update game manifests to latest releases"
          title: "🚀 New Port Updates Available"
          body: |
            The automated crawler has detected new releases. 
            Please verify the download links before merging.
          branch: auto-update-check
          delete-branch: true
          labels: |
            automated-update
            dependencies